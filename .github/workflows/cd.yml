name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  workflow_dispatch: # Allow manual trigger

env:
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/v8id-cloud-backend:latest

jobs:
  deploy:
    name: Deploy to OCI
    runs-on: ubuntu-latest

    # RESTRICT TO MAIN: Only run if the triggering CI workflow was on the main branch
    if: >
      github.event_name == 'workflow_dispatch' || 
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # SSH Setup
      # -------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_COMPUTE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.OCI_COMPUTE_IP }} >> ~/.ssh/known_hosts

      # -------------------------
      # Sync Scripts
      # -------------------------
      - name: Sync deployment scripts
        run: |
          # Ensure directory exists and has correct permissions
          ssh -o StrictHostKeyChecking=no ${{ secrets.OCI_COMPUTE_SSH_USER }}@${{ secrets.OCI_COMPUTE_IP }} "sudo mkdir -p /opt/v8id-cloud/scripts && sudo chown -R ${{ secrets.OCI_COMPUTE_SSH_USER }}:${{ secrets.OCI_COMPUTE_SSH_USER }} /opt/v8id-cloud"

          # Copy all scripts from infra/scripts to the VM
          scp -o StrictHostKeyChecking=no -r infra/scripts/* ${{ secrets.OCI_COMPUTE_SSH_USER }}@${{ secrets.OCI_COMPUTE_IP }}:/opt/v8id-cloud/scripts/

          # Fix permissions for execution
          ssh -o StrictHostKeyChecking=no ${{ secrets.OCI_COMPUTE_SSH_USER }}@${{ secrets.OCI_COMPUTE_IP }} "chmod +x /opt/v8id-cloud/scripts/*.sh"

      # -------------------------
      # Deploy on OCI VM
      # -------------------------
      - name: Deploy to OCI Compute
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.OCI_COMPUTE_SSH_USER }}@${{ secrets.OCI_COMPUTE_IP }} \
            "OCI_COMPARTMENT_ID='${{ secrets.OCI_COMPARTMENT_ID }}' OCI_VAULT_ID='${{ secrets.OCI_VAULT_ID }}' DOCKER_HUB_USERNAME='${{ secrets.DOCKER_HUB_USERNAME }}' DOCKER_HUB_TOKEN='${{ secrets.DOCKER_HUB_TOKEN }}' IMAGE_NAME='${{ secrets.DOCKER_HUB_USERNAME }}/v8id-cloud-backend:latest' bash -s" << 'EOF'

          set -euo pipefail

          # Ensure OCI CLI is in PATH (user-installed in ~/bin)
          export PATH=$PATH:$HOME/bin

          IMAGE="$IMAGE_NAME"
          CONTAINER="v8id-backend"
          SCRIPT_DIR="/opt/v8id-cloud/scripts"

          echo "[INFO] Setting up deployment environment"
          cd /opt/v8id-cloud

          echo "[INFO] Logging in to Docker Hub"
          echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

          echo "[INFO] Pulling latest image"
          docker pull "$IMAGE"

          echo "[INFO] Stopping existing container (if any)"
          docker rm -f "$CONTAINER" 2>/dev/null || true

          echo "[INFO] Loading secrets from OCI Vault"
          # Trim any accidental whitespace or quotes from OCIDs
          export OCI_COMPARTMENT_ID=$(echo "$OCI_COMPARTMENT_ID" | tr -d '[:space:]' | sed "s/['\"]//g")
          export OCI_VAULT_ID=$(echo "$OCI_VAULT_ID" | tr -d '[:space:]' | sed "s/['\"]//g")
          echo "[DEBUG] OCI_COMPARTMENT_ID length: ${#OCI_COMPARTMENT_ID}"
          echo "[DEBUG] OCI_COMPARTMENT_ID value: ${OCI_COMPARTMENT_ID:0:30}...${OCI_COMPARTMENT_ID: -10}"
          echo "[DEBUG] OCI_VAULT_ID length: ${#OCI_VAULT_ID}"
          echo "[DEBUG] OCI_VAULT_ID value: ${OCI_VAULT_ID:0:30}...${OCI_VAULT_ID: -10}"
          # Load secrets and create environment file
          bash "$SCRIPT_DIR/load-vault-secrets.sh" > /tmp/.env.vault

          echo "[INFO] Running Prisma migrations"
          # Debug: check what's in the vault secrets file
          echo "[DEBUG] Vault secrets file contents:"
          cat /tmp/.env.vault

          # Source env file to get DATABASE_URL (temporarily disable unbound variable check)
          set +u
          set -a
          source /tmp/.env.vault
          set +a
          set -u

          echo "[DEBUG] DATABASE_URL is set: ${DATABASE_URL:+yes}"

          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NODE_ENV=production \
            "$IMAGE" \
            sh -c "npx prisma migrate deploy --schema=prisma/schema.prisma"

          echo "[INFO] Starting backend container"
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 4000:4000 \
            --env-file /tmp/.env.vault \
            -e NODE_ENV=production \
            -e OCI_COMPARTMENT_ID="$OCI_COMPARTMENT_ID" \
            -e OCI_VAULT_ID="$OCI_VAULT_ID" \
            "$IMAGE"

          # Clean up temp env file
          rm -f /tmp/.env.vault

          echo "[INFO] Verifying container is running"
          docker ps | grep "$CONTAINER"

          echo "[INFO] Cleaning up old images"
          docker image prune -af --filter "until=24h" || true

          echo "[SUCCESS] Deployment completed"
          EOF

      # -------------------------
      # Health Check
      # -------------------------
      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl -fs http://${{ secrets.OCI_COMPUTE_IP }}/health; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 5
          done
          echo "❌ Health check failed"
          exit 1
