name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

env:
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/v8id-cloud-backend

jobs:
  deploy:
    name: Deploy to OCI
    runs-on: ubuntu-latest

    # 🚨 Run ONLY if CI succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # -------------------------
      # Docker Login (GitHub Runner)
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # -------------------------
      # SSH Setup
      # -------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_COMPUTE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.OCI_COMPUTE_IP }} >> ~/.ssh/known_hosts

      # -------------------------
      # Deploy on OCI VM
      # -------------------------
      - name: Deploy to OCI Compute
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.OCI_COMPUTE_SSH_USER }}@${{ secrets.OCI_COMPUTE_IP }} << 'EOF'
            set -e

            IMAGE="${{ env.IMAGE_NAME }}:latest"
            ENV_FILE="/opt/v8id-cloud/.env"

            echo "[INFO] Checking .env file"
            if [ ! -f "$ENV_FILE" ]; then
              echo "[ERROR] .env file not found at $ENV_FILE"
              exit 1
            fi

            echo "[INFO] Docker login"
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            echo "[INFO] Pulling latest image"
            docker pull "$IMAGE"

            echo "[INFO] Stopping old container"
            docker stop v8id-backend || true
            docker rm v8id-backend || true

            echo "[INFO] Running Prisma migrations"
            docker run --rm \
              --env-file "$ENV_FILE" \
              "$IMAGE" \
              pnpm prisma migrate deploy

            echo "[INFO] Starting backend container"
            docker run -d \
              --name v8id-backend \
              --restart unless-stopped \
              -p 4000:4000 \
              --env-file "$ENV_FILE" \
              "$IMAGE"

            echo "[INFO] Cleaning up old images"
            docker image prune -af --filter "until=24h" || true
          EOF

      # -------------------------
      # Health Check
      # -------------------------
      - name: Health Check
        run: |
          sleep 10
          for i in {1..30}; do
            if curl -f http://${{ secrets.OCI_COMPUTE_IP }}:4000/health; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 5
          done
          echo "❌ Health check failed"
          exit 1
