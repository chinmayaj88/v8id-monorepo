name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

env:
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/v8id-cloud-backend:latest

jobs:
  deploy:
    name: Deploy to OCI
    runs-on: ubuntu-latest

    # Run only if CI succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # -------------------------
      # SSH Setup
      # -------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_COMPUTE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.OCI_COMPUTE_IP }} >> ~/.ssh/known_hosts

      # -------------------------
      # Deploy on OCI VM
      # -------------------------
      - name: Deploy to OCI Compute
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.OCI_COMPUTE_SSH_USER }}@${{ secrets.OCI_COMPUTE_IP }} << 'EOF'

          set -euo pipefail

          IMAGE="${IMAGE_NAME}"
          ENV_FILE="/opt/v8id-cloud/.env"
          OCI_KEY="/opt/oci/oci_api_key.pem"
          CONTAINER="v8id-backend"

          echo "[INFO] Verifying environment file"
          if [ ! -r "$ENV_FILE" ]; then
            echo "[ERROR] Missing or unreadable .env at $ENV_FILE"
            exit 1
          fi

          echo "[INFO] Verifying OCI private key"
          if [ ! -r "$OCI_KEY" ]; then
            echo "[ERROR] OCI key not readable at $OCI_KEY"
            exit 1
          fi

          echo "[INFO] Pulling latest image"
          docker pull "$IMAGE"

          echo "[INFO] Stopping existing container (if any)"
          docker rm -f "$CONTAINER" 2>/dev/null || true

          echo "[INFO] Running Prisma migrations"
          docker run --rm \
            --env-file "$ENV_FILE" \
            "$IMAGE" \
            prisma migrate deploy

          echo "[INFO] Starting backend container"
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 4000:4000 \
            --env-file "$ENV_FILE" \
            -v /opt/oci:/opt/oci:ro \
            "$IMAGE"

          echo "[INFO] Verifying container is running"
          docker ps | grep "$CONTAINER"

          echo "[INFO] Cleaning up old images"
          docker image prune -af --filter "until=24h" || true

          echo "[SUCCESS] Deployment completed"
          EOF

      # -------------------------
      # Health Check
      # -------------------------
      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl -fs http://${{ secrets.OCI_COMPUTE_IP }}:4000/health; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 5
          done
          echo "❌ Health check failed"
          exit 1
