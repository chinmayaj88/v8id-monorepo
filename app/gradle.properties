# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Added Windows-specific options to prevent file locking issues
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.country=US -Duser.language=en

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# ============================================
# PERMANENT FIX FOR WINDOWS FILE LOCKING ISSUES
# ============================================

# Enable Gradle daemon (faster builds)
org.gradle.daemon=true

# Maximum idle time for daemon (stops daemon after 3 hours of inactivity)
# This helps release file locks when not building
org.gradle.daemon.idletimeout=10800000

# Enable build cache for faster incremental builds
org.gradle.caching=true

# Enable configuration on demand (only configure projects that are needed)
org.gradle.configureondemand=true

# Windows-specific: Disable file system watching to prevent file locks
# File watching can cause issues with OneDrive, antivirus, and Windows file system
org.gradle.vfs.watch=false

# Windows-specific: Use NIO file system which handles file locks better
# This prevents "file is being used by another process" errors
org.gradle.unsafe.configuration-cache=false

# Windows-specific: Disable file system case sensitivity checks
org.gradle.caseSensitiveFileSystem=false

# Windows-specific: Reduce parallel workers to prevent file contention
# Lower value = fewer simultaneous file operations = less locking
org.gradle.workers.max=2

# Windows-specific: Increase file lock timeout (if supported by Gradle version)
# Gives more time for file operations to complete
# Note: This property may not be available in all Gradle versions

# Windows-specific: Disable build scan (can cause file locks)
# Uncomment if you need build scans, but it can cause locking issues
# org.gradle.scan=false

# Windows-specific: Use conservative file system operations
# Prevents aggressive file locking that causes build failures
org.gradle.unsafe.configuration-cache-problems=warn
